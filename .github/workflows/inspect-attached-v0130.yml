name: Inspect attached HCA v0.13.0 sources
on:
  push:
    branches:
      - codex/v0.13.2-development
    paths:
      - .github/workflows/inspect-attached-v0130.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.13.2-development
      - name: Download and inspect archives
        env:
          NAS_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-c550-81f4-b9b2-51962b447149/raw?se=2026-09-14T16%3A58%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0a2-ebe1-702f-be96-e8832c2ddafc&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T07%3A37%3A25Z&ske=2026-09-15T07%3A37%3A25Z&sks=b&skv=2026-02-06&sig=JLYlrM62GUViT47Log0QrdvIFb8y1fK9imhqur2p%2Bh4%3D"
          PLUGIN_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-8208-81f4-976f-2c7eb6251aa1/raw?se=2026-09-14T16%3A58%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0a2-ebe1-702f-be96-e8832c2ddafc&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T06%3A40%3A02Z&ske=2026-09-15T06%3A40%3A02Z&sks=b&skv=2026-02-06&sig=sIwrEekX7E4n%2ByVyC%2BlggBOjmNi6wOVBRqNHB%2B8YHMI%3D"
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          curl -fL "$NAS_URL" -o "$workdir/nas.zip"
          curl -fL "$PLUGIN_URL" -o "$workdir/plugin.zip"
          unzip -q "$workdir/nas.zip" -d "$workdir/nas"
          unzip -q "$workdir/plugin.zip" -d "$workdir/plugin"
          export WORKDIR="$workdir"
          python - <<'PY'
          from pathlib import Path
          import os,re,hashlib
          root=Path(os.environ["WORKDIR"])
          out=Path("development/reports/attached-v0130-analysis.txt")
          rows=[]
          for label,base in [("NAS",root/"nas"),("PLUGIN",root/"plugin")]:
              rows.append(f"## {label} FILES")
              for p in sorted(base.rglob("*")):
                  if p.is_file():
                      rows.append(str(p.relative_to(base)))
              rows.append("")
          patterns=re.compile(r"woocommerce/customers|customer.*sync|sync.*customer|billing_first_name|first_name|last_name|company_name|/mail/accounts|mail/accounts|imap|smtp|attachment|signature|discount|credit|voucher|rabatt|guthaben|gutschein",re.I)
          for label,base in [("NAS",root/"nas"),("PLUGIN",root/"plugin")]:
              for p in base.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".py",".php",".js",".json",".md",".txt"}: continue
                  try: lines=p.read_text(encoding="utf-8",errors="replace").splitlines()
                  except: continue
                  hits=[i for i,x in enumerate(lines) if patterns.search(x)]
                  if not hits: continue
                  rows.append(f"## {label}: {p.relative_to(base)}")
                  selected=set()
                  for i in hits: selected.update(range(max(0,i-5),min(len(lines),i+9)))
                  last=-2
                  for i in sorted(selected):
                      if i!=last+1: rows.append(f"-- line {i+1} --")
                      line=lines[i]
                      if re.search(r"(password|secret|api.?key|token)\s*[:=]",line,re.I):
                          line=re.sub(r"([:=]\s*)[^,}\]]+",r"\1<redacted>",line)
                      rows.append(f"{i+1}: {line}")
                      last=i
                  rows.append("")
          for name in ["nas.zip","plugin.zip"]:
              b=(root/name).read_bytes()
              rows.append(f"{name} sha256 {hashlib.sha256(b).hexdigest()} size {len(b)}")
          out.write_text("\n".join(rows)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development/reports/attached-v0130-analysis.txt
          git commit -m "Analyze attached v0.13.0 NAS and plugin sources"
          git push
