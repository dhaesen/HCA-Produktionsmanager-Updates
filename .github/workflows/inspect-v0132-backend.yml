name: Inspect HCA customer and mail internals
on:
  push:
    branches:
      - codex/v0.13.2-development
    paths:
      - .github/workflows/inspect-v0132-backend.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.13.2-development
      - name: Inspect source
        env:
          NAS_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-c550-81f4-b9b2-51962b447149/raw?se=2026-09-14T16%3A58%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0a2-ebe1-702f-be96-e8832c2ddafc&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T07%3A37%3A25Z&ske=2026-09-15T07%3A37%3A25Z&sks=b&skv=2026-02-06&sig=JLYlrM62GUViT47Log0QrdvIFb8y1fK9imhqur2p%2Bh4%3D"
          PLUGIN_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-8208-81f4-976f-2c7eb6251aa1/raw?se=2026-09-14T16%3A58%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0a2-ebe1-702f-be96-e8832c2ddafc&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T06%3A40%3A02Z&ske=2026-09-15T06%3A40%3A02Z&sks=b&skv=2026-02-06&sig=sIwrEekX7E4n%2ByVyC%2BlggBOjmNi6wOVBRqNHB%2B8YHMI%3D"
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          curl -fL "$NAS_URL" -o "$workdir/nas.zip"
          curl -fL "$PLUGIN_URL" -o "$workdir/plugin.zip"
          unzip -q "$workdir/nas.zip" -d "$workdir/nas"
          unzip -q "$workdir/plugin.zip" -d "$workdir/plugin"
          export WORKDIR="$workdir"
          python - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ["WORKDIR"])
          out=[]
          def add_context(label,path,patterns,radius=18):
              lines=path.read_text(encoding="utf-8",errors="replace").splitlines()
              rx=re.compile("|".join(f"(?:{x})" for x in patterns),re.I)
              hits=[i for i,x in enumerate(lines) if rx.search(x)]
              selected=set()
              for i in hits:selected.update(range(max(0,i-radius),min(len(lines),i+radius+1)))
              out.append(f"## {label} · {path.name}")
              last=-2
              for i in sorted(selected):
                  if i!=last+1:out.append(f"-- line {i+1} --")
                  line=lines[i]
                  if re.search(r"(password|secret|consumer_secret|api.?key|token)\s*[:=]",line,re.I):
                      line=re.sub(r"([:=]\s*)[^,}\]]+",r"\1<redacted>",line)
                  out.append(f"{i+1}: {line}")
                  last=i
          nas=next((root/"nas").rglob("hca_shared.py"))
          add_context("NAS",nas,[r"CREATE TABLE IF NOT EXISTS crm_customers",r"ALTER TABLE crm_customers",r"mail_accounts",r"woocommerce/customers/sync",r"def _woo_customer",r"@router.*mail/accounts",r"async def mail_",r"def _mail_account"],25)
          for p in (root/"plugin").rglob("*.php"):
              txt=p.read_text(encoding="utf-8",errors="replace")
              if re.search(r"hca.*customer|customer.*hca|customer-portal|rest.*customer",txt,re.I):
                  add_context("PLUGIN",p,[r"register_rest_route",r"customer",r"billing_first_name",r"first_name",r"last_name"],12)
          Path("development/reports/backend-focused.txt").write_text("\n".join(out)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development/reports/backend-focused.txt
          git commit -m "Inspect v0.13.0 customer and mail internals"
          git push
