name: HCA Update veröffentlichen

on:
  push:
    paths:
      - "incoming/*.hcaupdate"
      - "incoming/*.hcaupdate.b64part.*"
      - "incoming/*.zip.b64part.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update-Datei bestimmen
        id: update
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED="$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'incoming/*.hcaupdate' 'incoming/*.hcaupdate.b64part.*')"
            PART="$(printf '%s\n' "$CHANGED" | grep -E '\.hcaupdate\.b64part\.[0-9]+$' | tail -n 1 || true)"
            if [ -n "$PART" ]; then
              BASE="${PART%%.b64part.*}"
              FILE="/tmp/$(basename "$BASE")"
              cat "${BASE}.b64part."* > "$FILE"
            else
              FILE="$(printf '%s\n' "$CHANGED" | grep -E '\.hcaupdate$' | tail -n 1 || true)"
            fi
          else
            FILE="$(find incoming -maxdepth 1 -type f -name '*.hcaupdate' -print | sort -V | tail -n 1)"
          fi

          if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
            echo "Keine neu hinzugefügte oder geänderte .hcaupdate-Datei gefunden."
            exit 1
          fi

          unzip -t "$FILE" >/dev/null
          echo "Veröffentliche: $FILE"
          mkdir -p /tmp/hca_manifest
          unzip -p "$FILE" hca-update.json > /tmp/hca_manifest/hca-update.json
          PRODUCT="$(jq -r '.product // empty' /tmp/hca_manifest/hca-update.json)"
          VERSION="$(jq -r '.version // empty' /tmp/hca_manifest/hca-update.json)"
          DESCRIPTION="$(jq -r '.description // "HCA Produktionsmanager Update"' /tmp/hca_manifest/hca-update.json)"

          if [ "$PRODUCT" != "HCA Produktionsmanager" ]; then
            echo "Falsche Produktkennung: $PRODUCT"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "Version fehlt in hca-update.json"
            exit 1
          fi

          TAG="v${VERSION#v}"
          BASENAME="$(basename "$FILE")"
          SHA_FILE="/tmp/${BASENAME%.hcaupdate}.sha256"
          sha256sum "$FILE" | awk '{print $1}' > "$SHA_FILE"

          NAS_BASE="incoming/HCA_NAS_Patch_v${VERSION#v}.zip"
          NAS_FILE="$NAS_BASE"
          NAS_SHA_FILE=""
          if [ -f "$NAS_FILE" ]; then
            :
          elif compgen -G "${NAS_BASE}.b64part.*" >/dev/null; then
            NAS_FILE="/tmp/$(basename "$NAS_BASE")"
            cat "${NAS_BASE}.b64part."* > "$NAS_FILE"
          else
            NAS_FILE=""
          fi

          if [ -n "$NAS_FILE" ] && [ -f "$NAS_FILE" ]; then
            NAS_SHA_FILE="/tmp/$(basename "${NAS_FILE%.zip}").sha256"
            sha256sum "$NAS_FILE" | awk '{print $1}' > "$NAS_SHA_FILE"
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"
          echo "nas_file=$NAS_FILE" >> "$GITHUB_OUTPUT"
          echo "nas_sha_file=$NAS_SHA_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo 'description<<EOF'
            echo "$DESCRIPTION"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.update.outputs.file }}
          SHA_FILE: ${{ steps.update.outputs.sha_file }}
          NAS_FILE: ${{ steps.update.outputs.nas_file }}
          NAS_SHA_FILE: ${{ steps.update.outputs.nas_sha_file }}
          TAG: ${{ steps.update.outputs.tag }}
          VERSION: ${{ steps.update.outputs.version }}
          DESCRIPTION: ${{ steps.update.outputs.description }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="/tmp/hca_release_notes.md"
          printf '## HCA Produktionsmanager %s\n\n%s\n\n### Installation\nDer HCA Produktionsmanager erkennt dieses Stable-Update automatisch. Alternativ kann die `.hcaupdate` weiterhin manuell unter Einstellungen → Update einspielen installiert werden. Falls ein NAS-Patch beigefügt ist, zuerst dessen Anleitung beachten und danach das Desktop-Update installieren.\n' "$VERSION" "$DESCRIPTION" > "$NOTES"

          ASSETS=("$FILE" "$SHA_FILE")
          if [ -n "$NAS_FILE" ] && [ -f "$NAS_FILE" ]; then
            ASSETS+=("$NAS_FILE" "$NAS_SHA_FILE")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "HCA Produktionsmanager $VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "HCA Produktionsmanager $VERSION" --notes-file "$NOTES" --latest
          fi

      - name: Prüfsummen anzeigen
        shell: bash
        run: |
          cat "${{ steps.update.outputs.sha_file }}"
          if [ -n "${{ steps.update.outputs.nas_sha_file }}" ]; then
            cat "${{ steps.update.outputs.nas_sha_file }}"
          fi
