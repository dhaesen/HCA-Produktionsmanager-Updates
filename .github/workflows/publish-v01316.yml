name: Build and publish HCA v0.13.16
on:
  push:
    branches: [codex/v0.13.2-development]
    paths:
      - .github/workflows/publish-v01316.yml
      - development/v0.13.16/**
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.13.2-development
      - name: Download verified v0.13.15 base
        run: |
          set -euo pipefail
          curl -fL --retry 5 'https://github.com/dhaesen/HCA-Produktionsmanager-Updates/releases/download/v0.13.15/HCA_Update_v0.13.15.hcaupdate' -o /tmp/HCA_Update_v0.13.15.hcaupdate
          echo '441bffe91899ff07d3a2fa8be023c3ccb22df998d3f354599443e5bd29ce4088  /tmp/HCA_Update_v0.13.15.hcaupdate' | sha256sum -c -
      - name: Build corrected client
        run: |
          set -euo pipefail
          mkdir -p work/client dist
          unzip -q /tmp/HCA_Update_v0.13.15.hcaupdate -d work/client
          cp development/v0.13.16/hca-v01316.js work/client/payload/
          cp development/v0.13.16/AENDERUNGEN_v0.13.16.txt work/client/payload/
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('work/client'); payload=root/'payload'; html_path=payload/'index.html'
          html=html_path.read_text(encoding='utf-8')
          old='  <script src="/hca-v01315.js?v=0.13.15"></script>\n'
          new='  <script src="/hca-v01316.js?v=0.13.16"></script>\n'
          if html.count(old)!=1: raise SystemExit('v0.13.15 script reference not unique')
          html_path.write_text(html.replace(old,new,1),encoding='utf-8')
          (payload/'hca-v01315.js').unlink(missing_ok=True)
          (payload/'version.json').write_text(json.dumps({'version':'0.13.16','channel':'test','released':'2026-09-15'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'hca-update.json').write_text(json.dumps({'product':'HCA Produktionsmanager','version':'0.13.16','description':'Exakte Wiederherstellung der funktionierenden WooCommerce-Veredelungspreisfunktion aus v0.13.6.1.'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Regression and package checks
        run: |
          set -euo pipefail
          node development/v0.13.16/test_pricing.js
          node --check work/client/payload/app.js
          node --check work/client/payload/hca-v01316.js
          python - <<'PY'
          from pathlib import Path
          import re
          old=Path('work/client/payload/app.js').read_text(encoding='utf-8')
          new=Path('work/client/payload/hca-v01316.js').read_text(encoding='utf-8')
          pattern=r'hca103ShopPrice=async function\(line\)\{.*?\n\};'
          baseline=re.findall(pattern,old,re.S)[-1]
          restored=re.search(r'window\.(hca103ShopPrice=async function\(line\)\{.*?\n\};)',new,re.S).group(1)
          assert baseline==restored, 'Preisfunktion weicht von v0.13.6.1 ab'
          html=Path('work/client/payload/index.html').read_text(encoding='utf-8')
          assert 'hca-v01316.js?v=0.13.16' in html
          assert 'hca-v01315.js?v=0.13.15' not in html
          PY
          (cd work/client && zip -qr "$GITHUB_WORKSPACE/dist/HCA_Update_v0.13.16.hcaupdate" hca-update.json payload)
          (cd dist && sha256sum HCA_Update_v0.13.16.hcaupdate > HCA_Update_v0.13.16.sha256)
          unzip -t dist/HCA_Update_v0.13.16.hcaupdate
          (cd dist && sha256sum -c HCA_Update_v0.13.16.sha256)
      - name: Publish and verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'EOF'
          HCA Produktionsmanager v0.13.16 Testbuild

          Die Veredelungspreisfunktion wurde exakt auf den nachweislich funktionierenden
          Stand aus v0.13.6.1 zurückgesetzt. Gespeicherte WooCommerce-IDs für Druckart,
          Einrichtung und Bearbeitung werden nicht mehr neu zugeordnet oder überschrieben.

          Nur das Clientupdate installieren. WooCommerce-Plugin, NAS und Datenbank bleiben unverändert.
          EOF
          gh release create v0.13.16 dist/* --repo dhaesen/HCA-Produktionsmanager-Updates --title 'HCA Produktionsmanager 0.13.16 Testbuild' --notes-file /tmp/notes.md --prerelease
          mkdir verify
          for file in dist/*; do name=$(basename "$file"); curl -fL --retry 5 "https://github.com/dhaesen/HCA-Produktionsmanager-Updates/releases/download/v0.13.16/$name" -o "verify/$name"; done
          (cd verify && sha256sum -c HCA_Update_v0.13.16.sha256)
