name: Build and publish HCA v0.13.22
on:
  push:
    branches: [codex/v0.13.2-development]
    paths:
      - .github/workflows/publish-v01322.yml
      - development/v0.13.22/**
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.13.2-development
      - name: Fetch verified client base
        run: |
          set -euo pipefail
          mkdir -p ../build
          curl -fL --retry 5 https://github.com/dhaesen/HCA-Produktionsmanager-Updates/releases/download/v0.13.21/HCA_Update_v0.13.21.hcaupdate -o ../build/HCA_Update_v0.13.21.hcaupdate
          printf '%s  %s\n' '5d6358ae44c47dc7fc84007f74b15e6544a0c8922970dca43b4908da504e3328' '../build/HCA_Update_v0.13.21.hcaupdate' | sha256sum -c -
      - name: Test and build
        run: |
          set -euo pipefail
          node --check development/v0.13.22/hca-v01322.js
          node development/v0.13.22/test_client.js
          python -m py_compile development/v0.13.22/patch_server.py development/v0.13.22/build_v01322.py development/v0.13.22/test_server.py
          python development/v0.13.22/test_server.py
          python development/v0.13.22/build_v01322.py
          (cd ../build && sha256sum -c HCA_Update_v0.13.22.sha256 && sha256sum -c HCA_NAS_Erweiterung_v0.13.22.sha256)
          unzip -t ../build/HCA_Update_v0.13.22.hcaupdate
          unzip -t ../build/HCA_NAS_Erweiterung_v0.13.22.zip
      - name: Publish and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'EOF'
          HCA v0.13.22

          Der Bereich „Mengenstaffel“ und seine automatisch erzeugten Mengenoptionen
          wurden entfernt. Das normale Mengenfeld bleibt bestehen.

          Produkt und zugehörige Veredelungskosten werden auf Angebot, Auftrag und
          Rechnung als gemeinsame Positionsgruppe dargestellt: 1.1, 1.2, 1.3 usw.
          Innerhalb einer Gruppe gibt es keine waagerechten Trennlinien; erst die
          nächste Produktgruppe erhält einen neuen Tabellenblock.

          Das WooCommerce-Plugin und die HCA-Datenbank werden nicht verändert.
          EOF
          gh release create v0.13.22 ../build/HCA_Update_v0.13.22.hcaupdate ../build/HCA_Update_v0.13.22.sha256 ../build/HCA_NAS_Erweiterung_v0.13.22.zip ../build/HCA_NAS_Erweiterung_v0.13.22.sha256 --repo dhaesen/HCA-Produktionsmanager-Updates --title 'HCA 0.13.22' --notes-file /tmp/notes.md --prerelease
          mkdir verify
          for file in HCA_Update_v0.13.22.hcaupdate HCA_NAS_Erweiterung_v0.13.22.zip; do
            curl -fL --retry 5 "https://github.com/dhaesen/HCA-Produktionsmanager-Updates/releases/download/v0.13.22/$file" -o "verify/$file"
          done
          cp ../build/HCA_Update_v0.13.22.sha256 ../build/HCA_NAS_Erweiterung_v0.13.22.sha256 verify/
          (cd verify && sha256sum -c HCA_Update_v0.13.22.sha256 && sha256sum -c HCA_NAS_Erweiterung_v0.13.22.sha256)
