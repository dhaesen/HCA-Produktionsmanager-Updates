name: Build launcher hotfix v0.13.68.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-hotfix-v01368-2/**'
      - '.github/workflows/build-launcher-hotfix-v01368-2.yml'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        shell: pwsh
        run: msbuild native-hotfix-v01368-2/HcaWindowsHost.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Compile Windows launcher
        shell: pwsh
        run: msbuild native-hotfix-v01368-2/HcaWindowsHost.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:RestoreIgnoreFailedSources=true

      - name: Validate compiled launcher
        shell: pwsh
        run: |
          $exe = 'native-hotfix-v01368-2/bin/Release/net48/HCA_Produktionsmanager.exe'
          if (!(Test-Path $exe)) { throw 'Compiled launcher is missing.' }
          $version = (Get-Item $exe).VersionInfo.FileVersion
          if ($version -ne '0.13.68.2') { throw "Unexpected file version: $version" }
          Write-Host "Built launcher version $version"

      - name: Create repair package
        id: package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'HCA_Launcher_Reparatur_v0.13.68.2'
          $payload = Join-Path $stage 'payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'native-hotfix-v01368-2/bin/Release/net48/HCA_Produktionsmanager.exe' (Join-Path $payload 'HCA_Produktionsmanager.exe')
          Copy-Item 'native-hotfix-v01368-2/HCA_REPARIEREN.cmd' $stage
          Copy-Item 'native-hotfix-v01368-2/REPARIEREN.ps1' $stage
          Copy-Item 'native-hotfix-v01368-2/ANLEITUNG.txt' $stage
          $exeHash = (Get-FileHash -Algorithm SHA256 (Join-Path $payload 'HCA_Produktionsmanager.exe')).Hash.ToLowerInvariant()
          "$exeHash  payload/HCA_Produktionsmanager.exe" | Set-Content -Encoding ascii (Join-Path $stage 'SHA256SUMS_REPAIR.txt')
          $zip = Join-Path $env:GITHUB_WORKSPACE 'HCA_Launcher_Reparatur_v0.13.68.2.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $zipHash | Set-Content -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HCA_Launcher_Reparatur_v0.13.68.2
          path: |
            HCA_Launcher_Reparatur_v0.13.68.2.zip
            HCA_Launcher_Reparatur_v0.13.68.2.zip.sha256

      - name: Add hotfix to release v0.13.68
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.13.68 HCA_Launcher_Reparatur_v0.13.68.2.zip HCA_Launcher_Reparatur_v0.13.68.2.zip.sha256 --clobber
